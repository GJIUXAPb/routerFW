name: tests

on:
  push:
  pull_request:

jobs:
  linux-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set executable permissions
        shell: bash
        run: |
          chmod +x _Builder.sh _packer.sh tester.sh
          test -x _Builder.sh
          test -x _packer.sh
          test -x tester.sh

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: for f in _Builder.sh _packer.sh _unpacker.sh tester.sh system/*.sh; do bash -n "$f"; done
        shell: bash

      - name: ShellCheck
        run: shellcheck --severity=error _Builder.sh tester.sh system/*.sh

      - name: Localization keys
        run: diff <(grep -E '^(L_|H_)' system/lang/ru.env | sed 's/=.*//' | sort) <(grep -E '^(L_|H_)' system/lang/en.env | sed 's/=.*//' | sort)
        shell: bash

      - name: Version sync
        run: |
          ver=$(grep -E '^ROUTERFW_VERSION=' system/version.env | cut -d= -f2 | tr -d '\r')
          grep -Fq "VER_NUM=\"$ver\"" _Builder.sh
          grep -Fq "set \"VER_NUM=$ver\"" _Builder.bat
          grep -Fq "v$ver+" README.md
          grep -Fq "v$ver+" README.en.md
          grep -Fq "Version: $ver." docs/ARCHITECTURE_en.md
          grep -Fq "Версия: $ver." docs/ARCHITECTURE_ru.md
        shell: bash

      - name: BOM expectations
        run: |
          test_bom() { [[ "$(head -c 3 "$1")" == $'\xef\xbb\xbf' ]]; }
          errors=0
          for f in system/create_profile.ps1 system/import_ipk.ps1; do
            test_bom "$f" || { echo "BOM missing in $f"; errors=1; }
          done
          for f in _Builder.sh system/lang/ru.env README.md; do
            test_bom "$f" && { echo "Unexpected BOM in $f"; errors=1; }
          done
          exit "$errors"
        shell: bash

      - name: Forbid global docker prune
        run: |
          if grep -R -E '(docker(\.exe)?|podman) (network|volume|system) prune|run_container .* (network|volume|system) prune|\$C_EXE .*system prune|%CONTAINER_EXE% system prune' _Builder.sh _Builder.bat tester.sh tester.bat system/*.sh system/*.ps1; then
            echo "Forbidden global docker prune command found"
            exit 1
          fi
        shell: bash

      - name: Run bash tester
        run: bash ./tester.sh
        shell: bash
        env:
          ROUTERFW_TEST_MODE: "1"

      - name: Upload Linux tester log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tester-log-linux
          path: tester_log_lin.md

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run batch tester
        run: .\tester.bat
        shell: cmd
        env:
          ROUTERFW_TEST_MODE: "1"

      - name: Upload Windows tester log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tester-log-windows
          path: tester_log_win.md

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set executable permissions
        run: chmod +x _Builder.sh _packer.sh tester.sh
        shell: bash

      - name: Docker compose smoke
        run: |
          docker info
          docker compose -f system/docker-compose.yaml config >/dev/null
          docker compose -f system/docker-compose-src.yaml config >/dev/null
          ROUTERFW_RUNTIME=docker bash ./_Builder.sh help >/dev/null

          rm -rf firmware_output/imagebuilder/docker-smoke firmware_output/sourcebuilder/docker-smoke
          mkdir -p firmware_output/imagebuilder/docker-smoke firmware_output/sourcebuilder/docker-smoke

          SELECTED_CONF=tplink_tl_wr1043nd_v2_24105_ow_full.conf HOST_OUTPUT_DIR=./firmware_output/imagebuilder/docker-smoke HOST_PKGS_DIR=./custom_packages/tplink_tl_wr1043nd_v2_24105_ow_full HOST_FILES_DIR=./custom_files/tplink_tl_wr1043nd_v2_24105_ow_full docker compose -f system/docker-compose.yaml -p docker-smoke-ib run --build --rm builder-openwrt sh -lc '
            id
            touch /builder_workspace/.routerfw-write-test
            touch /output/imagebuilder/docker-smoke/.routerfw-output-test
          '
          test -f firmware_output/imagebuilder/docker-smoke/.routerfw-output-test

          SELECTED_CONF=tplink_tl_wr1043nd_v2_24105_ow_full.conf HOST_OUTPUT_DIR=./firmware_output/sourcebuilder/docker-smoke HOST_PKGS_DIR=./src_packages/tplink_tl_wr1043nd_v2_24105_ow_full HOST_PATCHES_DIR=./custom_patches/tplink_tl_wr1043nd_v2_24105_ow_full HOST_FILES_DIR=./custom_files/tplink_tl_wr1043nd_v2_24105_ow_full docker compose -f system/docker-compose-src.yaml -p docker-smoke-src run --build --rm builder-src-openwrt sh -lc '
            id
            chown build:build /output
            sudo -u build sh -lc "
              id
              echo ok > /output/result.txt
            "
          '
          test -f firmware_output/sourcebuilder/docker-smoke/result.txt
        shell: bash

  podman-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set executable permissions
        run: chmod +x _Builder.sh _packer.sh tester.sh
        shell: bash

      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman podman-compose
        shell: bash

      - name: Podman compose smoke
        run: |
          if podman compose version >/dev/null 2>&1; then
            COMPOSE_CMD=(podman compose)
          else
            COMPOSE_CMD=(podman-compose)
          fi
          podman info
          "${COMPOSE_CMD[@]}" -f system/docker-compose.yaml -f system/podman-compose.yaml config >/dev/null
          "${COMPOSE_CMD[@]}" -f system/docker-compose-src.yaml -f system/podman-compose-src.yaml config >/dev/null
          ROUTERFW_RUNTIME=podman bash ./_Builder.sh help >/dev/null

          rm -rf firmware_output/imagebuilder/podman-smoke firmware_output/sourcebuilder/podman-smoke
          mkdir -p firmware_output/imagebuilder/podman-smoke firmware_output/sourcebuilder/podman-smoke

          SELECTED_CONF=tplink_tl_wr1043nd_v2_24105_ow_full.conf HOST_OUTPUT_DIR=./firmware_output/imagebuilder/podman-smoke HOST_PKGS_DIR=./custom_packages/tplink_tl_wr1043nd_v2_24105_ow_full HOST_FILES_DIR=./custom_files/tplink_tl_wr1043nd_v2_24105_ow_full "${COMPOSE_CMD[@]}" -f system/docker-compose.yaml -f system/podman-compose.yaml -p podman-smoke-ib run --build --rm builder-openwrt sh -lc '
            id
            touch /builder_workspace/.routerfw-write-test
            touch /output/imagebuilder/podman-smoke/.routerfw-output-test
          '
          test -f firmware_output/imagebuilder/podman-smoke/.routerfw-output-test
          test -w firmware_output/imagebuilder/podman-smoke/.routerfw-output-test
          test "$(stat -c '%u' firmware_output/imagebuilder/podman-smoke/.routerfw-output-test)" = "$(id -u)"

          SELECTED_CONF=tplink_tl_wr1043nd_v2_24105_ow_full.conf HOST_OUTPUT_DIR=./firmware_output/sourcebuilder/podman-smoke HOST_PKGS_DIR=./src_packages/tplink_tl_wr1043nd_v2_24105_ow_full HOST_PATCHES_DIR=./custom_patches/tplink_tl_wr1043nd_v2_24105_ow_full HOST_FILES_DIR=./custom_files/tplink_tl_wr1043nd_v2_24105_ow_full "${COMPOSE_CMD[@]}" -f system/docker-compose-src.yaml -f system/podman-compose-src.yaml -p podman-smoke-src run --build --rm builder-src-openwrt sh -lc '
            id
            sudo -u build sh -lc "
              id
              echo ok > /output/result.txt
            "
          '
          test -f firmware_output/sourcebuilder/podman-smoke/result.txt
          test -w firmware_output/sourcebuilder/podman-smoke/result.txt
          test "$(stat -c '%u' firmware_output/sourcebuilder/podman-smoke/result.txt)" = "$(id -u)"
        shell: bash
